name: formline-admin
services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ['127.0.0.1:55432:5432']
    # Postgres 18 images keep the data under /var/lib/postgresql/18/docker and declare
    # /var/lib/postgresql as the volume, so the tmpfs sits there (17 used …/data).
    tmpfs: ['/var/lib/postgresql']
    volumes: ['./tests/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['127.0.0.1:56432:6432']
    volumes:
      - ./tests/db/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./tests/db/userlist.txt:/etc/pgbouncer/userlist.txt:ro
