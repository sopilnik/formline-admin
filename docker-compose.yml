name: formline-admin
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ['127.0.0.1:55432:5432']
    # Postgres 18 images keep the data under /var/lib/postgresql/18/docker and declare
    # /var/lib/postgresql as the volume, so the tmpfs sits there (17 used …/data).
    tmpfs: ['/var/lib/postgresql']
    volumes: ['./tests/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['127.0.0.1:56432:6432']
    volumes:
      - ./tests/db/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./tests/db/userlist.txt:/etc/pgbouncer/userlist.txt:ro
