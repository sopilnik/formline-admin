name: Deploy

# A push to main: the checks of ci.yml, then the image to GitHub's registry with provenance and an SBOM, the
# panel's container pointed at it, the budget guard switched on again and the smoke test through the edge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # The registry's write token lives in this job alone, which installs no packages: no install script can reach it. Off
  # main the image stays unbuilt, as the production environment keeps the deploy job to main.
  image:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The builder and the SBOM scanner hold the registry's write token while they build and push, so they are pinned by
      # digest like every action here; Dependabot does not see them, a version update changes both lines by hand.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: FORMLINE_VERSION=${{ github.sha }}
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Point the panel's container at the new image
        run: node scripts/deploy-image.ts
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          MC_APP_ID: ${{ vars.MC_APP_ID }}
          MC_CONTAINER_NAME: ${{ vars.MC_CONTAINER_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Keep the budget guard switched on
        run: gh workflow enable budget-guard.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test through the edge
        run: node scripts/smoke.ts
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          MC_APP_ID: ${{ vars.MC_APP_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
