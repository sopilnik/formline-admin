name: Probe

# The probes of the hosting setup against the live panel, one at a time, by hand (scripts/probe.ts). They print field
# names, figures, timings and statuses — never a key, a secret or a raw hostname.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'p1 usage, p2 edge headers, p3 endpoint, p4 cache, p5 database, p6 demo timing'
        required: true
        type: choice
        options: [p1, p2, p3, p4, p5, p6]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: inputs.probe == 'p6'
        run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/probe.ts
        env:
          PROBE: ${{ inputs.probe }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          MC_APP_ID: ${{ vars.MC_APP_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
